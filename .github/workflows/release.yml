name: Release XPI
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        default: patch
        type: choice
        options:
        - patch
        - minor
        - major
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 1
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      with:
        experimental: true
    - name: Install dependencies
      run: npm ci
    - name: Write src/credentials.js
      env:
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: printf 'export const clientId = "%s";\nexport const clientSecret = "%s";\n' "${GOOGLE_CLIENT_ID:-xxx}" "${GOOGLE_CLIENT_SECRET:-xxx}" > src/credentials.js
    - name: Bump version
      id: bump
      env:
        BUMP: ${{ inputs.bump || 'patch' }}
      run: echo "version=$(node scripts/bump-version.mjs "$BUMP")" >> "$GITHUB_OUTPUT"
    - name: Build and sign XPI
      env:
        WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
        WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      run: mise run sign:xpi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: tab-session-manager-firefox-signed
        path: dist/signed/*.xpi
        if-no-files-found: error
    - name: Commit version bump and tag
      env:
        VERSION: ${{ steps.bump.outputs.version }}
      run: |-
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add src/manifest.json src/manifest-ff.json
        git commit -m "chore(release): v$VERSION [skip ci]"
        git tag "v$VERSION"
        git push origin "HEAD:${{ github.ref_name }}" "v$VERSION"
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.bump.outputs.version }}
      run: gh release create "v$VERSION" dist/signed/*.xpi --generate-notes
